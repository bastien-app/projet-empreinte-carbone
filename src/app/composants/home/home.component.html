<h1>Bienvenue sur notre calculateur d'empreinte carbone !</h1>

<form [formGroup]="formulaireLogin" (ngSubmit)="login()">
  <label for="login">Identifiant </label>
  <input type="text" id="login" name="login" formControlName="login" >
  <br>
  <label for="password">Mot de passe </label>
  <input type="password" id="password" name="password" formControlName="password" >
  <br>
  <button type="submit">Se connecter</button>
  <button type="button" (click)="register()" >S'enregistrer</button>
  <br>
  <label for="remember">Se souvenir de moi</label>
  <input type="checkbox" id="remember" formControlName="remember">
</form>

@if (error) {
  <p>{{error}}</p>
}

@if (service.statut){
  <p>{{ service.statut }}</p>
}
